[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-table-splitter"
description = "跨平台 GUI 表格分割工具：按行数把大表切成多个文件，支持 CSV / Excel / JSON / TSV"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "StarAsh042", email = "StarAsh042@users.noreply.github.com" }]
keywords = ["csv", "excel", "json", "tsv", "split", "gui", "tkinter", "pandas"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.0.3,<3.0",
    "ttkbootstrap>=1.10,<2",
    "openpyxl>=3.1.2,<4",
    # 仅用于读取旧版 .xls；pandas 2.x 已移除 .xls 写入能力，因此本项目也不再提供 .xls 导出
    "xlrd>=2.0.1,<3",
    # 只有 Windows 需要（实际上仅用于可选能力；缺失不影响运行）
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.3"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "pyinstaller>=6.3",
]

[project.scripts]
table-splitter = "universal_table_splitter.cli:main"

[project.gui-scripts]
table-splitter-gui = "universal_table_splitter.ui.app:main"

[project.urls]
Homepage = "https://github.com/StarAsh042/Universal_Table_Splitter"
Source = "https://github.com/StarAsh042/Universal_Table_Splitter"
Issues = "https://github.com/StarAsh042/Universal_Table_Splitter/issues"

[tool.setuptools.dynamic]
version = { attr = "universal_table_splitter.__version__" }

[tool.setuptools.packages.find]
include = ["universal_table_splitter*"]

[tool.setuptools.package-data]
universal_table_splitter = ["py.typed"]

# --------------------------------------------------------------------------- 测试
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-q -m "not slow"'
markers = [
    "slow: 需要真实大文件（30MB）或耗时较长的测试，用 `pytest -m slow` 显式运行",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandas.*",
]

# ---------------------------------------------------------------------- 静态检查
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".codebuddy", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE"]
ignore = [
    "E501",   # 行长由 formatter 负责
    "B008",   # 允许在默认参数里调用函数（dataclass/typer 风格）
    "SIM108", # 允许 if/else 三元，不必强行改写可读性更好的分支
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]   # 测试允许 assert 与延迟导入
"universal_table_splitter/ui/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["universal_table_splitter"]
